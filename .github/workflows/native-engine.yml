name: Native engine build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-native-engine:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native runtime
        run: cargo build --release --manifest-path native/Cargo.toml -p maclator
      - name: JIT/interpreter differential smoke test
        run: native/target/release/archshift-lator-native --selftest-jit dpreg 100
